name: Daily job scan

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install @playwright/mcp@latest playwright
          npx --yes playwright install --with-deps chromium

      - name: Run job finder
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "job-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.txt reports/
          git diff --cached --quiet || git commit -m "Daily job scan: $(date -u +%Y-%m-%d)"
          git push
